<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <style>
    :root {
      --ink: #111111;
      --paper: #ffffff;
      --ground: #fff8d6;
      --purple: #6525d1;
      --purple-light: #e9ddfb;
      --mint: #69d99b;
      --mint-light: #ddf8e9;
      --amber: #ffbe5c;
      --amber-light: #ffe6ae;
      --blue: #66b8f4;
      --blue-light: #ddeeff;
      --red: #d64b28;
      --muted: #5a5a5a;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #eef0f3;
      color: var(--ink);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .artifact {
      width: min(1600px, 100%);
      aspect-ratio: 16 / 9;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgb(0 0 0 / 8%);
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
      background: var(--paper);
    }

    text {
      fill: var(--ink);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    .title-pill { fill: var(--ink); }
    .title-text { fill: #fff; font-size: 44px; font-weight: 800; }
    .section-banner { fill: var(--purple); stroke: var(--ink); stroke-width: 3; }
    .section-title { fill: #fff; font-size: 25px; font-weight: 800; }
    .outer-region { fill: var(--ground); stroke: var(--ink); stroke-width: 3; stroke-dasharray: 13 10; }
    .group-region { fill: #f7f0ff; stroke: var(--ink); stroke-width: 3; stroke-dasharray: 7 7; }
    .service { fill: var(--mint); stroke: var(--ink); stroke-width: 4; }
    .store { fill: var(--amber); stroke: var(--ink); stroke-width: 4; }
    .database { fill: var(--blue); stroke: var(--ink); stroke-width: 4; }
    .neutral-card { fill: #fff; stroke: var(--ink); stroke-width: 4; }
    .soft-purple { fill: var(--purple-light); stroke: var(--ink); stroke-width: 3; }
    .soft-mint { fill: var(--mint-light); stroke: var(--ink); stroke-width: 3; }
    .soft-amber { fill: var(--amber-light); stroke: var(--ink); stroke-width: 3; }
    .soft-blue { fill: var(--blue-light); stroke: var(--ink); stroke-width: 3; }
    .node-label { font-size: 26px; font-weight: 800; }
    .node-meta { font-size: 18px; fill: var(--ink); }
    .small-label { font-size: 18px; font-weight: 700; }
    .meta { font-size: 17px; fill: var(--muted); }
    .primary-line { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .secondary-line { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 9; }
    .failure-line { fill: none; stroke: var(--red); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 11 9; }
    .accent-line { fill: none; stroke: var(--purple); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .badge { fill: var(--purple); stroke: var(--ink); stroke-width: 2.5; }
    .badge-text { fill: #fff; font-size: 20px; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
    .failure-badge { fill: var(--red); stroke: var(--ink); stroke-width: 2.5; }
    .icon-stroke { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .icon-fill { fill: #fff; stroke: var(--ink); stroke-width: 4; }
    .benefit-title { font-size: 21px; font-weight: 800; }
    .benefit-meta { font-size: 17px; }

    @media (max-width: 900px) {
      body { padding: 0; }
      .artifact { border-radius: 0; border-left: 0; border-right: 0; }
    }

    @media print {
      html, body { background: #fff; }
      body { padding: 0; }
      .artifact { width: 100%; box-shadow: none; border: 0; }
    }
  </style>

  <script>
    (() => {
      const EPSILON = 0.75;
      const svg = document.querySelector('svg');
      const report = { ok: true, errors: [], warnings: [], adjustments: [] };

      const box = (element) => {
        const b = element.getBBox();
        return { x: b.x, y: b.y, width: b.width, height: b.height, right: b.x + b.width, bottom: b.y + b.height };
      };

      const expanded = (b, amount) => ({
        x: b.x - amount,
        y: b.y - amount,
        width: b.width + amount * 2,
        height: b.height + amount * 2,
        right: b.right + amount,
        bottom: b.bottom + amount
      });

      const intersects = (a, b, margin = 0) => {
        const aa = expanded(a, margin);
        const bb = expanded(b, margin);
        return aa.x < bb.right && aa.right > bb.x && aa.y < bb.bottom && aa.bottom > bb.y;
      };

      const inside = (inner, outer, padding = 0) => (
        inner.x >= outer.x + padding - EPSILON &&
        inner.y >= outer.y + padding - EPSILON &&
        inner.right <= outer.right - padding + EPSILON &&
        inner.bottom <= outer.bottom - padding + EPSILON
      );

      const pushError = (code, element, message, details = {}) => {
        report.errors.push({
          code,
          element: element?.id || element?.getAttribute?.('data-layout-object') || element?.textContent?.trim()?.slice(0, 80) || element?.tagName || 'unknown',
          message,
          ...details
        });
      };

      const visible = (element) => {
        const style = getComputedStyle(element);
        return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) !== 0;
      };

      const fitText = (text) => {
        const targetId = text.getAttribute('data-fit-box');
        if (!targetId) return;
        const target = document.getElementById(targetId);
        if (!target) {
          pushError('FIT_TARGET_MISSING', text, `Missing fit target #${targetId}`);
          return;
        }

        const padding = Number(text.getAttribute('data-padding') || 12);
        const min = Number(text.getAttribute('data-min-font-size') || 15);
        const computed = getComputedStyle(text);
        const initial = Number.parseFloat(computed.fontSize);
        let size = initial;
        const targetBox = box(target);

        while (size > min && !inside(box(text), targetBox, padding)) {
          size -= 1;
          text.style.fontSize = `${size}px`;
        }

        if (size !== initial) {
          report.adjustments.push({
            element: text.id || text.textContent.trim().slice(0, 80),
            from: initial,
            to: size,
            target: targetId
          });
        }

        if (size < min - EPSILON) {
          pushError('TEXT_BELOW_MIN_SIZE', text, `Text fell below minimum ${min}px`, { size, min, target: targetId });
        }

        if (!inside(box(text), targetBox, padding)) {
          pushError('TEXT_OUTSIDE_FIT_BOX', text, `Text does not fit inside #${targetId} at minimum readable size`, {
            textBox: box(text),
            targetBox,
            padding,
            minFontSize: min
          });
        }
      };

      const checkViewBox = () => {
        const vb = svg.viewBox.baseVal;
        const bounds = { x: vb.x, y: vb.y, width: vb.width, height: vb.height, right: vb.x + vb.width, bottom: vb.y + vb.height };
        for (const text of svg.querySelectorAll('text')) {
          if (!visible(text) || text.dataset.lintIgnore === 'true') continue;
          const textBox = box(text);
          if (!inside(textBox, bounds, 0)) {
            pushError('TEXT_OUTSIDE_VIEWBOX', text, 'Text extends outside the SVG viewBox', { textBox, viewBox: bounds });
          }
          const min = Number(text.getAttribute('data-min-font-size') || 15);
          const size = Number.parseFloat(getComputedStyle(text).fontSize);
          if (size + EPSILON < min) {
            pushError('TEXT_BELOW_MIN_SIZE', text, `Rendered font size ${size}px is below ${min}px`, { size, min });
          }
        }
      };

      const checkTextOverlap = () => {
        const texts = [...svg.querySelectorAll('text')].filter((element) => visible(element) && element.dataset.lintIgnore !== 'true');
        for (let i = 0; i < texts.length; i += 1) {
          for (let j = i + 1; j < texts.length; j += 1) {
            const a = texts[i];
            const b = texts[j];
            if (a.parentElement === b.parentElement && a.closest('text') === b.closest('text')) continue;
            if (intersects(box(a), box(b), -1)) {
              pushError('TEXT_TEXT_OVERLAP', a, 'Two text labels overlap', {
                other: b.id || b.textContent.trim().slice(0, 80),
                firstBox: box(a),
                secondBox: box(b)
              });
            }
          }
        }
      };

      const checkObjectOverlap = () => {
        const objects = [...svg.querySelectorAll('[data-layout-object]')].filter((element) => visible(element) && element.dataset.lintIgnore !== 'true');
        for (let i = 0; i < objects.length; i += 1) {
          for (let j = i + 1; j < objects.length; j += 1) {
            const a = objects[i];
            const b = objects[j];
            if (a.contains(b) || b.contains(a)) continue;
            if (intersects(box(a), box(b), -3)) {
              pushError('LAYOUT_OBJECT_OVERLAP', a, 'Peer layout objects overlap', {
                other: b.getAttribute('data-layout-object'),
                firstBox: box(a),
                secondBox: box(b)
              });
            }
          }
        }
      };

      const checkConnectorTextCollisions = () => {
        const texts = [...svg.querySelectorAll('text')].filter((element) =>
          visible(element) &&
          element.dataset.lintIgnore !== 'true' &&
          element.dataset.lintIgnoreConnectors !== 'true'
        );

        for (const path of svg.querySelectorAll('path[data-connector]')) {
          if (!visible(path) || path.dataset.lintIgnore === 'true') continue;
          const length = path.getTotalLength();
          if (!Number.isFinite(length) || length <= 0) continue;
          const step = Math.max(4, Math.min(10, length / 60));

          for (const text of texts) {
            const target = expanded(box(text), 3);
            let collided = false;
            for (let d = 0; d <= length; d += step) {
              const p = path.getPointAtLength(Math.min(d, length));
              if (p.x >= target.x && p.x <= target.right && p.y >= target.y && p.y <= target.bottom) {
                collided = true;
                break;
              }
            }
            if (collided) {
              pushError('TEXT_CONNECTOR_COLLISION', text, 'Text intersects a connector path', {
                connector: path.id || path.getAttribute('data-connector'),
                textBox: box(text)
              });
            }
          }
        }
      };

      const run = async () => {
        if (document.fonts?.ready) await document.fonts.ready;
        for (const text of svg.querySelectorAll('text[data-fit-box]')) fitText(text);
        checkViewBox();
        checkTextOverlap();
        checkObjectOverlap();
        checkConnectorTextCollisions();
        report.ok = report.errors.length === 0;
        document.querySelector('.artifact')?.setAttribute('data-layout-status', report.ok ? 'pass' : 'fail');
        window.__diagramLayoutReport = report;
      };

      run().catch((error) => {
        report.ok = false;
        report.errors.push({ code: 'LAYOUT_RUNTIME_ERROR', message: String(error?.message || error) });
        window.__diagramLayoutReport = report;
      });
    })();
  </script>
</body>
</html>
